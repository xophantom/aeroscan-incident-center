name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format, lint e typecheck
    runs-on: ubuntu-latest
    env:
      MONGOMS_DISABLE_POSTINSTALL: '1'
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # api e web resolvem os tipos do shared pelo dist
      - run: pnpm bootstrap
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  test-unit:
    name: Testes shared (cobertura) e web
    runs-on: ubuntu-latest
    env:
      MONGOMS_DISABLE_POSTINSTALL: '1'
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bootstrap
      - run: pnpm --filter @aeroscan/shared test --coverage
      - run: pnpm --filter @aeroscan/web test

  test-api:
    name: Testes API (unit + e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # O mongodb-memory-server baixa o mongod (~70 MB) no install; o cache evita baixar a cada run
      - run: echo "MONGOMS_DOWNLOAD_DIR=$HOME/.cache/mongodb-binaries" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aeroscan/api test:unit
      - run: pnpm --filter @aeroscan/api test:e2e

  build:
    name: Build (frontend-dist + Docker)
    runs-on: ubuntu-latest
    env:
      MONGOMS_DISABLE_POSTINSTALL: '1'
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
      - name: frontend-dist/ versionado está atualizado
        run: |
          git diff --exit-code -- frontend-dist
          if [ -n "$(git status --porcelain -- frontend-dist)" ]; then
            echo "::error::frontend-dist/ desatualizado. Rode 'pnpm build:web' e commite o resultado."
            git status --porcelain -- frontend-dist
            exit 1
          fi
      - run: docker compose build
